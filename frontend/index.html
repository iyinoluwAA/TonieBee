<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <!-- Zooming is allowed (WCAG 1.4.4): the old site turned it off. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only this website's own scripts and styles run; nothing from anywhere else.
         Mantine sets inline styles, hence style-src 'unsafe-inline' (no inline scripts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1E40AF" />
    <meta
      name="description"
      content="Life, critical illness and disability insurance, explained in plain language — and a consultation with a licensed advisor when you’re ready."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Toniebee — life, critical illness and disability insurance</title>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        This website needs JavaScript. You can also reach us by email.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
