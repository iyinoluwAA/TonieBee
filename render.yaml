# Render Blueprint: the whole TonieBee website (pages + API) as ONE service, built from
# the Dockerfile. Create it once: Render → New → Blueprint → this repo (docs/DEPLOY.md).
# Values marked `sync: false` are asked for when the Blueprint is created — paste them
# straight into Render, never into a chat, an email or the repo.
#
# The database is Neon's free Postgres (DATABASE_URL), not Render's (deleted after 30 days).
#
# Free plan: the service sleeps after 15 minutes without visitors, and the next visit waits
# about a minute. Fine for showing the owner; before launch, change `plan` to `starter`
# (always on, about US$7/month) — a business site mustn't keep visitors waiting.

services:
  - type: web
    name: toniebee
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # PREVIEW=1 builds even while the owner's details are missing (and tells search engines
    # to stay away). Remove it, and SITE_PREVIEW below, to launch: the live build then
    # refuses until every detail is filled in.
    dockerBuildArgs:
      - key: PREVIEW
        value: "1"
    region: ohio            # closest Render region to Ontario; put the Neon database in US East too
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # deploy main only after GitHub's checks pass
    envVars:
      - key: APP_ENV
        value: production
      - key: SITE_PREVIEW
        value: "1"
      # Neon → project → Connect → the DIRECT connection string (not "pooled"), ending in
      # ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # The site's own address (set after the first deploy shows it, e.g.
      # https://toniebee.onrender.com; later the custom domain).
      - key: SITE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      # One proxy (Render's) adds the visitor's address in front of the service.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: BRAND_NAME
        value: Toniebee
      # Each: `openssl rand -hex 32` on the laptop. Keep both in a password manager —
      # losing DATA_ENCRYPTION_KEY means setting up every admin's authenticator again.
      - key: AUTH_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Email (Brevo SMTP) — see docs/DEPLOY.md. Until it's set, sign-in says email isn't
      # switched on yet, and requests are saved without a notification.
      - key: MAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
